name: Build and verify Linux

# The desktop app on Linux: build the AppImage and the deb from the private source, start the
# AppImage on a virtual display, and photograph it. Nothing is published from here; the AppImage
# is uploaded as a run artifact only, and goes on the download page only on the owner's word.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit of the private app repo to build"
        required: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: none298-dotcom/thelongview-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Packages the build and the photographs need
        run: |
          sudo apt-get update -qq
          # fakeroot and dpkg for jpackage's deb; xvfb, a window manager and xdotool to run and
          # drive the app; imagemagick to photograph; libnotify for the reminder; libfuse2 for the
          # AppImage itself.
          sudo apt-get install -y -qq fakeroot xvfb openbox xdotool imagemagick libnotify-bin libfuse2t64 notification-daemon fonts-noto-core xcompmgr libwebkit2gtk-4.1-dev wmctrl

      - name: Build the checkout helper (WebKitGTK)
        run: |
          set -e
          mkdir -p android/desktop/app-resources/linux
          gcc -O2 -Wall -Werror -o android/desktop/app-resources/linux/the-long-view-checkout linux/checkout/checkout.c \
            $(pkg-config --cflags --libs webkit2gtk-4.1)
          chmod +x android/desktop/app-resources/linux/the-long-view-checkout

      - name: Build the AppImage and the deb
        working-directory: android
        run: |
          ./gradlew --no-daemon -q :desktop:packageAppImage :desktop:packageDeb
          find desktop/build/compose/binaries -maxdepth 5 | head -30

      - name: Wrap the app folder as a real AppImage
        run: |
          set -e
          mkdir -p artifacts-appimage
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          appdir=TheLongView.AppDir
          mkdir -p "$appdir"
          cp -a "android/desktop/build/compose/binaries/main/app/The Long View/." "$appdir/"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/bin/The Long View" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          cp android/packaging/../desktop/icons/the-long-view.png "$appdir/the-long-view.png" 2>/dev/null || cp android/desktop/icons/the-long-view.png "$appdir/the-long-view.png"
          sed -e 's/^Exec=.*/Exec=AppRun/' -e 's/^Icon=.*/Icon=the-long-view/' packaging/flathub/com.thelongviewapp.TheLongView.desktop > "$appdir/the-long-view.desktop"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" artifacts-appimage/The-Long-View-x86_64.AppImage || { mkdir -p artifacts-appimage; ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" artifacts-appimage/The-Long-View-x86_64.AppImage; }
          ls -la artifacts-appimage

      - name: Start a display
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          DISPLAY=:99 openbox &
          sleep 2
          # A compositor, as every mainstream desktop has, so see-through windows draw as they do there.
          DISPLAY=:99 xcompmgr &
          sleep 1

      - name: Photograph the first open (onboarding)
        env:
          DISPLAY: ":99"
          THE_LONG_VIEW_DESKTOP_DATA_DIR: ${{ runner.temp }}/fresh
        run: |
          mkdir -p artifacts "$THE_LONG_VIEW_DESKTOP_DATA_DIR"
          app=$(find android/desktop/build/compose/binaries/main/app -path "*/bin/*" -type f -perm -u+x | head -1)
          echo "launcher: $app"
          "$app" > artifacts/fresh.log 2>&1 &
          sleep 25
          xdotool search --name "The Long View" | head -3
          import -window root artifacts/linux-welcome.png
          pkill -f "bin/The Long Vie[w]" || true
          sleep 2

      - name: Photograph each screen with a few weeks of check-ins
        env:
          DISPLAY: ":99"
          THE_LONG_VIEW_DESKTOP_DATA_DIR: ${{ runner.temp }}/seeded
        run: |
          mkdir -p "$THE_LONG_VIEW_DESKTOP_DATA_DIR"
          python3 - <<'PY'
          import json, os, datetime
          d = os.environ["THE_LONG_VIEW_DESKTOP_DATA_DIR"]
          today = datetime.date.today()
          start = today - datetime.timedelta(days=24)
          ledger = {}
          for i in range(24):
              day = start + datetime.timedelta(days=i)
              n = max(0, 8 - i // 3)
              ledger[day.isoformat()] = {"cigarettesSmoked": float(n), "isLogged": True,
                                         "loggedAtEpochMillis": int(datetime.datetime(day.year, day.month, day.day, 20).timestamp() * 1000)}
          state = {"profile": {"currentAge": 40, "sex": "unstated", "yearsSmoking": 15.0, "baselineCigarettesPerDay": 12.0},
                   "trackingStartDay": start.isoformat(), "ledger": ledger}
          json.dump(state, open(os.path.join(d, "state.json"), "w"))
          PY
          app=$(find android/desktop/build/compose/binaries/main/app -path "*/bin/*" -type f -perm -u+x | head -1)
          "$app" > artifacts/seeded.log 2>&1 &
          win=""
          for i in $(seq 1 90); do
            win=$(xdotool search --onlyvisible --name "The Long View" 2>/dev/null | head -1)
            [ -n "$win" ] && break
            sleep 1
          done
          echo "window after ${i}s"; pgrep -af "bin/The Long Vie[w]" | cut -c1-120
          sleep 8
          echo "window: $win"
          # Where the upgrade dialog lands with the app window where the desktop put it.
          import -window root artifacts/linux-upgrade-dialog.png
          # Checkout from the app: "Start 7 days free" (Yearly is selected) opens Stripe in the
          # helper's own window. Found by its title, photographed, then closed the way a person
          # closes it, which the dialog reads as "closed, not paid".
          dlg=$(xdotool search --onlyvisible --name "The Long View" | tail -1)
          wmctrl -lG || true
          for w in $(xdotool search --onlyvisible --name "The Long View"); do
            echo "window $w: $(xdotool getwindowgeometry $w | tr '\n' ' ')"
            import -window $w artifacts/window-$w.png || true
          done
          cat "android/desktop/build/compose/binaries/main/app/The Long View/lib/app/The Long View.cfg" || true
          xdotool mousemove --sync 593 562
          sleep 1
          xdotool click 1
          sleep 3
          import -window root artifacts/linux-after-click.png
          for i in $(seq 1 30); do pgrep -f the-long-view-checkou[t] >/dev/null && break; sleep 1; done
          pgrep -af the-long-view-checkou[t] || echo "NO CHECKOUT HELPER RUNNING"
          sleep 20
          import -window root artifacts/linux-checkout.png
          wmctrl -l || true
          wmctrl -c "Checkout" || true
          sleep 3
          pgrep -f the-long-view-checkou[t] && echo "helper still running" || echo "helper closed"
          import -window root artifacts/linux-after-checkout.png
          xdotool windowmove "$win" 0 0 windowsize "$win" 1200 820
          sleep 3
          import -window root artifacts/linux-first-open.png
          # The upgrade dialog shows once on the first open; Escape is its "Not now".
          xdotool key Escape
          sleep 3
          import -window root artifacts/linux-today.png
          # The sidebar, top to bottom: Today, History, Money, Settings.
          for pair in "History:150" "Money:205" "Settings:260"; do
            name=${pair%%:*}; y=${pair##*:}
            xdotool mousemove --window "$win" 100 "$y" click 1
            sleep 3
            import -window root "artifacts/linux-$(echo $name | tr A-Z a-z).png"
          done
          notify-send "The Long View" "Notification check from CI" || echo "no notification service"
          pkill -f "bin/The Long Vie[w]" || true

      - name: The checkout helper on its own (exit codes)
        env:
          DISPLAY: ":99"
        run: |
          bundled=$(find android/desktop/build/compose/binaries/main/app -name the-long-view-checkout | head -1)
          echo "helper in the app image: $bundled"; ls -l "$bundled"
          # The copy the app made in its data folder when it started checkout above.
          h=$(find "${{ runner.temp }}/seeded" -name the-long-view-checkout | head -1)
          echo "runnable copy: $h"; ls -l "$h"
          set +e
          "$h" checkout "https://example.com/" T; echo "a foreign URL exits $? (want 2)"
          "$h" checkout "https://thelongviewapp.com/billing-success" T; code=$?
          echo "the success page exits $code (want 0)"
          test "$code" = 0
          # A live Stripe page in the helper on its own, with the page's console in the log.
          url=$(curl -s -X POST https://thelongviewapp.com/api/billing/checkout -H 'content-type: application/json' \
                -d '{"billingCycle":"lifetime","from":"windows"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["checkoutUrl"])')
          "$h" checkout "$url" Checkout > artifacts/helper-console.log 2>&1 &
          sleep 25
          import -window root artifacts/linux-helper-alone.png
          wmctrl -c Checkout; sleep 2
          tail -40 artifacts/helper-console.log

      - name: Upload the photographs on their own (small, quick to read)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-photos
          path: artifacts/
          retention-days: 14

      - name: Upload the photographs and the AppImage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-verification
          path: |
            artifacts/
            artifacts-appimage/
            android/desktop/build/compose/binaries/**/*.deb
          retention-days: 14
