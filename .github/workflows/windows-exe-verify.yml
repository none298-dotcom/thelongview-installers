name: Build and verify Windows EXE

# Builds the jpackage EXE on a real Windows runner, installs it exactly as a
# Microsoft Store certifier does, and then asserts the things certification
# actually checks. Modelled on MyLinedChart's smoke-test-windows-installed.yml,
# whose own header records why it exists:
#
#   "still alive" is not "works". Microsoft rejected that app's Store submission
#   three times; twice the cause was a button that did nothing at all, and every
#   check up to that point only proved the process launches.
#
# So this workflow is built to fail on the things that were historically wrong,
# not to go green on the things that were always right.
#
# ─────────────────────────────────────────────────────────────────────────────
# THREE DIFFERENCES FROM MyLinedChart, all of which change the commands
# ─────────────────────────────────────────────────────────────────────────────
# 1. INSTALLER TYPE. MyLinedChart ships an NSIS installer, silent flag `/S`
#    (uppercase, case sensitive; lowercase opens the interactive installer and
#    hangs the job). This app ships a jpackage EXE, which is a WiX **Burn
#    bootstrapper** wrapping an MSI. Burn's silent flag is `/quiet`, and `/S`
#    means nothing to it. Copying `/S` across would hang here for a different
#    reason than it would there.
# 2. UI TOOLKIT. MyLinedChart is Electron, so it can be driven over the Chrome
#    DevTools Protocol on --remote-debugging-port. This is Compose Desktop:
#    Skia-rendered, no Chromium, no CDP. Clicking has to go through Windows UI
#    Automation instead, which is why the UIA step below is written as an
#    experiment that reports rather than a check that is assumed to work.
# 3. REPO LAYOUT. This repo is public and holds no application source. That is
#    not tidiness, it is the only way the job runs at all: the first attempt put
#    this workflow in the private source repo and every job died in three
#    seconds, before a runner was even assigned, with
#
#      "The job was not started because recent account payments have failed or
#       your spending limit needs to be increased."
#
#    Actions is free on public repos and metered on private ones, which is
#    exactly why MyLinedChart has a separate installers repo. Source is fetched
#    into the ephemeral workspace with a READ ONLY deploy key scoped to the one
#    private repo (narrower than MyLinedChart's account-level PAT), and it never
#    lands in this repo. Only finished artifacts do.

on:
  workflow_dispatch:
    inputs:
      # Each mode injects a DIFFERENT known defect, because one defect does not
      # exercise every assertion.
      #
      # OBSOLETE: per_user_install. It flipped the build to per-user and expected 10.1.2.10 to go
      # red, on the disproven theory that a certifier installs elevated and inspects as a normal
      # user. Two real Microsoft rejections (this app on 2026-08-12 for PER-MACHINE, and sibling
      # Reveal the Dream, same publisher, with the Windows Installer log) proved the certifier
      # installs UNELEVATED, so per-user is the CORRECT shipping scope, not a defect. Injecting it
      # now correctly PASSES. The mode is kept only so old dispatch links do not error; do not use it
      # to "prove an assertion bites". The certification assertions are now scope-aware: they read
      # perUserInstall from the source and check the scope-appropriate location.
      min_named_elements:
        # 4, because the screen the probe arrives at is the first onboarding step, and a working
        # bridge shows five names there: the window, three lines of copy and the Begin button.
        # Set from what a passing run actually reported, not from a guess. Deliberately low: the
        # failure this guards against is the tree collapsing to nothing, which is what happens
        # when jdk.accessibility is dropped from the runtime or Main.kt stops asking for the
        # bridge. A tighter number would break on a copy edit and teach everyone to ignore it.
        description: "Fail the accessibility step if the Java Access Bridge exposes fewer named elements than this. 0 reports without gating."
        type: string
        default: "4"
      break_mode:
        description: "Inject a known defect, to prove an assertion actually goes red. Always 'none' for a real build."
        type: choice
        default: none
        options:
          - none
          - per_user_install   # OBSOLETE: per-user is the correct scope now, this no longer fails
          - remove_arp_entry   # delete the HKLM uninstall key, must fail 10.2.7
          - dead_button        # stub the welcome button's handler, must fail the click check
          - deny_users_read    # OBSOLETE: only fed the retired cross-account standard-user check
      wait_seconds:
        description: "How long to let the installed app run before judging it"
        default: "40"
      source_ref:
        description: "Branch or commit sha of thelongview-app to build"
        default: "main"
      # OFF by default, and deliberately a separate decision from "did it pass".
      # Publishing is not a report, it is a commitment: the path is keyed by commit sha and
      # cannot be overwritten, so a sha published today can never be republished. While a
      # version is in review and might come back needing a rebuild, that is a door worth
      # leaving shut. Verification runs as often as it likes; publishing waits to be asked.
      publish:
        description: "Upload the signed installer to its permanent URL. Leave false until the build is one you intend to ship: a published sha can never be republished."
        type: boolean
        default: false

# Every action below is pinned to a full commit SHA, with its tag in a comment, so a moved or
# compromised tag cannot change what runs in the job that holds the signing login and the R2
# upload keys. Audit M3, 2026-09-13. To upgrade, resolve the new tag to its SHA and change both.
permissions:
  contents: read
  id-token: write     # OIDC token for Azure Trusted Signing. No stored credential exists.

jobs:
  build-and-verify:
    runs-on: windows-latest
    # TRAP, already paid for once on the other project: `secrets` is not valid in a step level
    # `if:`. Surfacing the values as job level `env` is the supported way for a step to ask
    # "is signing configured here", and it keeps the build working in a fork that has no Azure
    # access at all, which then simply produces an unsigned installer.
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      # The source is NOT in this repo. It is fetched here into the runner's
      # workspace, which is destroyed with the VM, using a deploy key that has
      # read access to that one private repo and nothing else.
      - name: Check out the private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: none298-dotcom/thelongview-app
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      # Second, and into a subdirectory, because the checkout above owns the
      # workspace root and cleans it. This is where the verification scripts
      # live; they are CI, not application source, so they stay in this repo.
      - name: Check out this repo's own scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ci

      - name: Record exactly which commit is being verified
        shell: pwsh
        run: |
          # Provenance. A green run against an unknown commit proves nothing,
          # so the sha goes in the log and in the artifact bundle.
          $sha = git rev-parse HEAD
          Write-Host "verifying thelongview-app @ $sha"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          "source_repo: none298-dotcom/thelongview-app`nsource_ref: ${{ inputs.source_ref }}`nsource_sha: $sha`nbreak_mode: ${{ inputs.break_mode }}" |
            Out-File artifacts/provenance.txt
          "sha=$sha" >> $env:GITHUB_OUTPUT
        id: src

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Runners come up at 1024x768. The app's window is larger than that, so the first run's
      # screenshot showed a welcome screen with no button on it, and the button was simply below
      # the bottom of the screen. A verification rig that cannot see the bottom of the window
      # cannot check the one control that matters.
      - name: Give the runner a display the window fits on
        continue-on-error: true
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "::warning::Set-DisplayResolution failed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "display is now $($b.Width)x$($b.Height)"

      # The point of this input is the owner's rule: a new test proves nothing
      # until it goes RED on the known-broken input. perUserInstall = true is
      # precisely what failed MyLinedChart certification twice, so flipping it
      # here must make the two assertions below fail, loudly and by name.
      - name: Inject the requested defect, to prove an assertion goes red
        if: ${{ inputs.break_mode != 'none' }}
        shell: pwsh
        run: |
          # Each patch must be verified to have APPLIED. A find-and-replace that silently
          # matches nothing produces a clean build, a green run, and the false conclusion
          # that the assertion caught something. Every branch below fails loudly instead.
          switch ("${{ inputs.break_mode }}") {
            "per_user_install" {
              $f = "android/desktop/build.gradle.kts"
              $t = Get-Content $f -Raw
              if ($t -notmatch "perUserInstall = false") { throw "patch target not found in $f" }
              $t.Replace("perUserInstall = false", "perUserInstall = true") | Set-Content $f
              Write-Host "::warning::perUserInstall = true ON PURPOSE. Certification 10.1.2.10 MUST fail."
            }
            "dead_button" {
              # The exact defect that failed the other app twice: a button that renders
              # perfectly and runs nothing.
              $f = "android/desktop/src/main/kotlin/com/thelongviewapp/desktop/onboarding/DesktopOnboarding.kt"
              $t = Get-Content $f -Raw
              $target = 'PrimaryButton("Begin", onClick = onBegin)'
              if (-not $t.Contains($target)) { throw "patch target not found in $f" }
              $t.Replace($target, 'PrimaryButton("Begin", onClick = {})') | Set-Content $f
              Write-Host "::warning::The Begin button's handler is stubbed out ON PURPOSE. The click check MUST fail."
            }
            "remove_arp_entry" {
              Write-Host "::warning::The HKLM uninstall entry will be deleted after install ON PURPOSE. Certification 10.2.7 MUST fail."
            }
          }

      # ── The Windows helper (windows/ in the app repo) ─────────────────────────────────
      # LongViewHelper.exe draws the reminder toast with its remind-me-later buttons and serves the
      # Windows 11 widgets; its sparse identity package gives it the identity widgets require. Both
      # are built and signed HERE, before the EXE, because the EXE installer carries them in
      # app\resources and signing afterwards would not reach inside it.
      - name: Set up the .NET 8 SDK (Windows helper)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      # Found with vswhere rather than microsoft/setup-msbuild: this repo allows only GitHub's own
      # actions and the two Azure ones, and Visual Studio is already on the runner.
      - name: Put msbuild on the PATH (Windows helper)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "msbuild not found" }
          Write-Host "msbuild: $msbuild"
          Split-Path $msbuild >> $env:GITHUB_PATH

      - name: Azure login for the helper (federated, OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The identity package's Publisher must equal the certificate's Subject exactly. Rather than
      # type it, sign a throwaway probe with the real certificate and read the Subject back.
      - name: Make a probe to read the signing Subject from
        shell: pwsh
        run: |
          # A real exe, because signing needs one: PowerShell 7's Add-Type cannot emit an
          # executable ("Both the assembly types 'ConsoleApplication' and 'WindowsApplication' are
          # not currently supported"), so the smallest .NET project stands in.
          $src = "$env:GITHUB_WORKSPACE\probe-src"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Set-Content "$src\probe.csproj" '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><AssemblyName>probe</AssemblyName><RuntimeIdentifier>win-x64</RuntimeIdentifier><SelfContained>false</SelfContained></PropertyGroup></Project>'
          Set-Content "$src\Program.cs" 'class P { static void Main() { } }'
          dotnet publish $src -o "$env:GITHUB_WORKSPACE\probe" --nologo -v quiet
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\probe\probe.exe")) { throw "probe build failed" }

      - name: Sign the probe (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files-folder: ${{ github.workspace }}\probe
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build and pack the Windows helper
        id: helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sig = Get-AuthenticodeSignature "$env:GITHUB_WORKSPACE\probe\probe.exe"
          $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "CN=The Long View CI test" }
          Write-Host "signing Subject: $subject"
          $version = (Select-String -Path android/desktop/build.gradle.kts -Pattern 'val appVersion = "([0-9.]+)"').Matches[0].Groups[1].Value
          $out = "$env:GITHUB_WORKSPACE\helper-out"
          pwsh windows/scripts/stamp-identity.ps1 -Subject $subject -Version $version -Out $out

          msbuild windows/Helper/LongViewHelper.csproj /restore /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 "/p:PublishDir=$out\" /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "helper build failed" }

          # makeappx insists the Executable named in the manifest exists in the packed folder, even
          # for a sparse package whose real exe lives outside it; a placeholder satisfies it.
          $stage = "$env:GITHUB_WORKSPACE\identity-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item windows/Package/AppxManifest.xml, windows/Package/Assets -Destination $stage -Recurse
          Set-Content -Path "$stage\LongViewHelper.exe" -Value "placeholder"
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d $stage /p "$out\TheLongViewIdentity.msix" /nv /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          Copy-Item windows/Package/Assets -Destination $out -Recurse -Force
          "out=$out" >> $env:GITHUB_OUTPUT
          "subject=$subject" >> $env:GITHUB_OUTPUT
          Get-ChildItem $out | Measure-Object -Property Length -Sum | ForEach-Object { Write-Host ("helper folder: {0:N1} MB, {1} files" -f ($_.Sum/1MB), $_.Count) }

      - name: Sign the helper and its identity package (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          files-folder: ${{ steps.helper.outputs.out }}
          files-folder-filter: exe,msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Put the helper where the installer picks it up
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @("LongViewHelper.exe", "TheLongViewIdentity.msix")) {
            $sig = Get-AuthenticodeSignature (Join-Path "${{ steps.helper.outputs.out }}" $f)
            Write-Host "$f signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ("${{ env.AZURE_CLIENT_ID }}" -ne "" -and $sig.Status -ne "Valid") { throw "$f is not validly signed" }
          }
          $dest = "android/desktop/app-resources/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "${{ steps.helper.outputs.out }}\*" -Destination $dest -Recurse -Force

      - name: Build the EXE
        working-directory: android
        shell: pwsh
        run: ./gradlew.bat :desktop:packageExe --no-daemon

      # Uninstalling must also unregister the widgets' identity package and the toast's protocol
      # handler, or both outlive the files. jpackage's supported hook for that is an overrides.wxi
      # The uninstall step: uninstalling has to take away the widgets' identity package and the
      # reminder toast's protocol handler, or a machine that removed the app still offers its
      # widgets. That lives in windows/installer/main.wxs, jpackage's own installer description
      # with one marked block added (its overrides.wxi hook is included where WiX refuses a custom
      # action). The Compose plugin clears jpackage's resource folder itself, so the installer is
      # built once more here from the app image, with Compose's own arguments and that file.
      - name: Build the app image the installer is rebuilt from
        working-directory: android
        shell: pwsh
        run: ./gradlew.bat :desktop:createDistributable --no-daemon

      - name: Rebuild the EXE with the uninstall step
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appImage = Get-ChildItem "android/desktop/build/compose/binaries/main/app" -Directory | Select-Object -First 1
          if (-not $appImage) { throw "no app image" }
          $argsFile = Get-ChildItem android/desktop/build/compose/tmp -Recurse -Filter "*.args.txt" |
                      Where-Object { (Get-Content $_.FullName -Raw) -match '(?m)^"?--type"?\r?\n"?exe"?' } |
                      Select-Object -First 1
          if (-not $argsFile) { throw "no jpackage argument file builds an exe" }
          $lines = Get-Content $argsFile.FullName

          # Everything about the contents comes from the app image, so the options that describe how
          # to build one are dropped; the rest is exactly what Compose asked for.
          $drop = @("--input", "--main-jar", "--main-class", "--java-options", "--module-path", "--add-modules", "--runtime-image", "--app-content")
          $kept = @()
          for ($n = 0; $n -lt $lines.Count; $n++) {
            $arg = $lines[$n].Trim('"')
            if ($drop -contains $arg) { $n++; continue }
            $kept += $lines[$n]
          }

          $mine = "$env:GITHUB_WORKSPACE\jpackage-resources"
          New-Item -ItemType Directory -Force -Path $mine | Out-Null
          # Compose writes its arguments quoted, so a plain IndexOf missed its --resource-dir and a
          # second one was appended; jpackage took the last, which is Compose's, and logged "using
          # default package resource overrides.wxi". Compare with the quotes stripped.
          # EVERY occurrence: Compose passes --resource-dir twice, and jpackage takes the last, so
          # replacing only the first left its own empty folder in charge and every resource came
          # back "Using default package resource".
          $found = $false
          for ($n = 0; $n -lt $kept.Count - 1; $n++) {
            if ($kept[$n].Trim('"') -ne "--resource-dir") { continue }
            $found = $true
            $current = $kept[$n + 1].Trim('"').Replace('\\', '\')
            if (Test-Path $current) { Copy-Item "$current\*" -Destination $mine -Recurse -Force -EA SilentlyContinue }
            $kept[$n + 1] = '"' + $mine.Replace('\', '/') + '"'
          }
          if (-not $found) { $kept += '--resource-dir'; $kept += '"' + $mine.Replace('\', '/') + '"' }
          # The installer description, jpackage's own plus our uninstall step. Checked against the
          # JDK in use before it is trusted: a JDK upgrade that changes main.wxs must fail here
          # rather than quietly ship an installer built from an old description.
          # A .jmod is a zip behind a four byte "JMOD" header, which .NET's zip reader refuses, so
          # it is copied without those bytes first.
          $jmod = "$env:GITHUB_WORKSPACE\jdk.jpackage.zip"
          $bytes = [System.IO.File]::ReadAllBytes("$env:JAVA_HOME\jmods\jdk.jpackage.jmod")
          [System.IO.File]::WriteAllBytes($jmod, $bytes[4..($bytes.Length - 1)])
          $extract = "$env:GITHUB_WORKSPACE\jpackage-default"
          Remove-Item $extract -Recurse -Force -EA SilentlyContinue
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jmod)
          $entry = $zip.Entries | Where-Object { $_.FullName -like "*jdk/jpackage/internal/resources/main.wxs" } | Select-Object -First 1
          if (-not $entry) {
            $zip.Dispose()
            Write-Host "::error::this JDK's jdk.jpackage module has no main.wxs to compare against"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$extract\main.wxs", $true)
          $zip.Dispose()
          # Compared line by line from <Wix onwards, with our marked blocks dropped: that skips our
          # own header comment and any difference in how the file starts.
          function Strip([string[]] $lines) {
            $out = @(); $skipping = $false; $started = $false
            foreach ($line in $lines) {
              if ($line -match 'TLV BEGIN') { $skipping = $true; continue }
              if ($line -match 'TLV END') { $skipping = $false; continue }
              if ($skipping) { continue }
              if (-not $started) { if ($line -match '^<Wix') { $started = $true } else { continue } }
              # Blank lines are dropped on both sides: removing the marked block leaves one behind,
              # and a blank line is not a difference that matters in XML.
              if ($line.Trim() -ne '') { $out += $line.TrimEnd() }
            }
            return ,$out
          }
          $ours = Strip (Get-Content windows/installer/main.wxs)
          $theirs = Strip (Get-Content "$extract\main.wxs")
          $difference = Compare-Object $ours $theirs
          if ($difference) {
            Write-Host "::error::windows/installer/main.wxs no longer matches this JDK's own main.wxs. Re-vendor it."
            $difference | ForEach-Object { Write-Host "  $($_.SideIndicator) $($_.InputObject)" }
            exit 1
          }
          Write-Host "main.wxs matches this JDK's, apart from the marked block"
          Copy-Item windows/installer/main.wxs -Destination $mine -Force
          Write-Host "resource dir holds: $((Get-ChildItem $mine | ForEach-Object Name) -join ', ')"
          $kept += '--app-image'; $kept += '"' + $appImage.FullName.Replace('\', '\\') + '"'

          # Passed as real arguments, not through an @argument file. Through the file every
          # resource came back "Using default package resource", including ours, so jpackage was not
          # reading the folder at all; PowerShell quotes each argument itself.
          # Values come from an argument file, where backslashes are escaped; passed directly they
          # must be plain again.
          $argv = @()
          for ($n = 0; $n -lt $kept.Count; $n++) { $argv += $kept[$n].Trim('"').Replace('\\', '\') }
          Write-Host "--- arguments ---"; $argv | ForEach-Object { Write-Host "  $_" }
          Push-Location $argsFile.Directory.FullName
          $output = & "$env:JAVA_HOME\bin\jpackage.exe" @argv 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          $output | Select-Object -Last 15 | ForEach-Object { Write-Host "jpackage: $_" }
          if (($output -join "`n") -notmatch "loaded from main.wxs") {
            Write-Host "::error::jpackage did not take our main.wxs, so the uninstall step is not in the installer"
          }
          if ($code -ne 0) {
            Write-Host "::error::the installer could not be rebuilt with the uninstall step"
            exit 1
          }
          Write-Host "jpackage exit: $code"
          Write-Host "produced: $((Get-ChildItem android/desktop/build/compose/binaries -Recurse -Filter *.exe | ForEach-Object Name) -join ', ')"

      - name: Find the installer
        id: find
        shell: pwsh
        run: |
          # The installer folder only. Searching all of binaries/ picked up the app image's own
          # launcher once the image started being built here, and then the signature check read an
          # exe nobody had signed.
          $exe = Get-ChildItem -Path android/desktop/build/compose/binaries/main/exe -Filter *.exe -EA SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { throw "No installer .exe produced" }
          Write-Host "installer: $($exe.FullName)  ($([int]($exe.Length/1MB)) MB)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # ── Authenticode signing ──────────────────────────────────────────────
      # Signed with a short-lived certificate Azure mints per run. Authentication is
      # OIDC/federated: the runner exchanges a GitHub token for an Azure one, so the AZURE_*
      # values are identifiers, not passwords, and no signing credential exists to leak.
      #
      # TRAP, already paid for once: azure/login MUST run first. trusted-signing-action
      # authenticates through DefaultAzureCredential, which knows nothing about GitHub OIDC on
      # its own; without this step it falls through every credential type and dies with
      # "SignerSign() failed", which reads like a signing problem rather than an auth one.
      - name: Azure login (federated, OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the installer (Azure Trusted Signing)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: mlcsigning
          certificate-profile-name: mlc-public-trust
          # TRAP, already paid for once: the signing client rejects a relative path, so this
          # must be absolute. github.workspace is what makes it absolute.
          files-folder: ${{ github.workspace }}\android\desktop\build\compose\binaries\main\exe
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # An unsigned installer triggers SmartScreen and is rejected for an EXE/MSI Store
      # submission, so this reports the real signer subject rather than assuming it.
      - name: Verify the signature actually landed
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "${{ steps.find.outputs.path }}"
          Write-Host "signature status: $($sig.Status)"
          Write-Host "signer:           $($sig.SignerCertificate.Subject)"
          Write-Host "timestamp:        $($sig.TimeStamperCertificate.Subject)"
          if ("${{ env.AZURE_CLIENT_ID }}" -eq "") {
            Write-Host "::warning::No Azure credentials in this context, so the installer is UNSIGNED. Fine for a fork, never for a release."
          } elseif ($sig.Status -ne "Valid") {
            Write-Host "::error::The installer is not validly signed ($($sig.Status)). It will trip SmartScreen and will be rejected as a Store package."
            exit 1
          }

      # ── The updater's own signature check, against this very installer ────
      # The desktop app refuses to run any update it cannot prove we signed. That check asks
      # Windows itself, so it cannot be exercised on the development Mac at all; on macOS the
      # three tests below skip, and a green run there says nothing about them.
      #
      # Here they are real. The first proves a genuine build is accepted, which is the check
      # failing closed on our own release; that exact mistake was made once already, with the
      # wrong company name hardcoded, and it would have refused every update for ever without
      # showing anybody anything. The third proves a validly signed program that is NOT ours is
      # still refused, using one shipped with Windows.
      #
      # Deliberately BEFORE the install and publish steps: an updater that would reject its own
      # release is a reason not to ship the release.
      - name: Prove the in-app updater accepts this build and refuses everything else
        # BLOCKING. It was continue-on-error while the updater was unreleased, and that hid a real
        # failure on every run through 1.4.8: Windows PowerShell started from this step's pwsh
        # inherited PowerShell 7's PSModulePath, could not load Microsoft.PowerShell.Security, and
        # the updater refused our own signed installer. GitHub reported the step as "success" the
        # whole time. Two app fixes made it pass: clearing PSModulePath for the child PowerShell
        # (122ca1e), then reading stdout apart from stderr, whose "#< CLIXML" progress block was
        # being read as the signature status (a19e4de). Green on run 34740601879. The updater ships
        # in Settings, so a red here is a reason not to publish.
        # gradlew.bat lives in android/, not at the repo root. Same as "Build the EXE" above; the
        # first version of this step omitted it and died with a command-not-found that reads like a
        # test failure.
        working-directory: android
        shell: pwsh
        env:
          TLV_SIGNED_INSTALLER: ${{ steps.find.outputs.path }}
        run: |
          if ("${{ env.AZURE_CLIENT_ID }}" -eq "") {
            Write-Host "::warning::Unsigned build, so the updater's publisher check cannot be proven here."
          }
          # NOT piped into Select-String. A pipeline's $LASTEXITCODE is the LAST command's, so
          # filtering the output here would have made this step pass whatever gradle decided.
          ./gradlew.bat :desktop:test --tests "*WindowsInstallerTest*" --tests "*WindowsUpdateScriptTest*" --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "The updater would not accept our own signed installer" }

      # ── The app lock's Windows half (D16) ─────────────────────────────────
      # The lock was verified by USING it on iPhone, on a Mac and on an Android emulator. Windows
      # had nothing, because there is no Windows machine on the development side and no emulator
      # for one, so `WindowsHello.kt` shipped as the single unproven piece of the feature. This
      # runner is a real Windows machine and can close most of that gap.
      #
      # WHAT IT CANNOT PROVE: a runner has no enrolled fingerprint, no PIN and no interactive
      # desktop, so nothing can answer a Hello prompt and a successful verification is unreachable
      # here. That last step still needs a person at a real machine.
      #
      # WHAT IT DOES PROVE, which is the part written from documentation and executed by nobody:
      # that the base64 -EncodedCommand payload is well formed, that powershell.exe parses the
      # script, that the WinRT UserConsentVerifier type resolves from a JVM-launched PowerShell,
      # that the AsTask reflection finds the right generic overload, and that a machine which
      # cannot ask degrades to Unavailable (which DISARMS the lock) rather than to Refused (which
      # would keep the gate up and could strand somebody outside their own history).
      #
      # BLOCKING, as of run 33254368517 which is the first time it went green. It was non-blocking
      # for exactly one run, and that run paid for the whole step: it went red on the assertion it
      # exists for and found a real lockout. `verify()` was returning Refused, which keeps the gate
      # up, where it had to return Unavailable, which disarms it. On a Windows machine whose Hello
      # stopped working the app would have refused to open, permanently. See WindowsHello.kt's
      # VERIFY_SCRIPT for the mapping that was wrong.
      #
      # Blocking now because that is the class of bug this catches, and shipping it is worse than
      # holding up a release.
      - name: Prove the app lock's Windows Hello bridge actually works
        working-directory: android
        shell: pwsh
        run: |
          # Not piped into Select-String: a pipeline's $LASTEXITCODE is the last command's, which
          # would make this pass whatever gradle decided. Same trap as the step above.
          ./gradlew.bat :desktop:test --tests "*WindowsHelloTest*" --no-daemon -i
          if ($LASTEXITCODE -ne 0) { throw "The Windows Hello bridge is broken on a real Windows machine" }

      - name: Silent install, exactly as a certifier does
        shell: pwsh
        run: |
          # /quiet, not /S. This is a WiX Burn bundle, see the header.
          $p = Start-Process -FilePath "${{ steps.find.outputs.path }}" -ArgumentList '/quiet' -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          # 0 = installed, 3010 = installed, reboot required. Both are success.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "Silent install failed with exit code $($p.ExitCode)"
          }

      # perUserInstall = true was expected to break both certification checks
      # and broke only one: jpackage wrote the HKLM uninstall entry regardless,
      # so 10.2.7 went green in the run that was supposed to prove it bites.
      # This deletes that key so the 10.2.7 assertion faces the condition it
      # claims to detect.
      - name: Delete the Add or Remove Programs entry (break_mode only)
        if: ${{ inputs.break_mode == 'remove_arp_entry' }}
        shell: pwsh
        run: |
          $removed = 0
          foreach ($k in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                           'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
            Get-ItemProperty $k -EA SilentlyContinue | Where-Object { $_.DisplayName -like '*Long View*' } |
              ForEach-Object { Write-Host "deleting $($_.PSPath)"; Remove-Item $_.PSPath -Recurse -Force; $removed++ }
          }
          if ($removed -eq 0) { throw "Nothing to delete, so this mutation would prove nothing" }

      # per_user_install cannot prove the standard-user check bites: it fails certification, which
      # throws, and every later step including that one is skipped. So this mutation leaves the
      # install perfectly certifiable and breaks only the thing the standard-user check exists for:
      # a shortcut in the right place, pointing at a binary an ordinary user is not allowed to read.
      # Inheritance is broken on the file alone, so the directory stays traversable and the failure
      # is "can see it, cannot open it" rather than "cannot find it".
      - name: Deny Users read on the installed binary (break_mode only)
        if: ${{ inputs.break_mode == 'deny_users_read' }}
        shell: pwsh
        run: |
          # Both scopes: a per-user install lands under %LOCALAPPDATA%, per-machine under Program Files.
          $roots = @("$env:LOCALAPPDATA\The Long View", "$env:ProgramFiles\The Long View", "${env:ProgramFiles(x86)}\The Long View") |
                   Where-Object { $_ -and (Test-Path $_) }
          $exe = $null
          foreach ($r in $roots) {
            $exe = Get-ChildItem $r -Recurse -Filter '*.exe' -EA SilentlyContinue |
                   Where-Object { $_.Name -notlike 'unins*' -and $_.Name -ne 'LongViewHelper.exe' } | Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) { throw "Installed binary not found, so this mutation would prove nothing" }
          Write-Host "removing Users read from $($exe.FullName)"
          icacls $exe.FullName /inheritance:d | Out-Null
          icacls $exe.FullName /remove:g "BUILTIN\Users" | Out-Null
          icacls $exe.FullName

      # ── The two things certification actually checks ──────────────────────
      # Deliberately ONE step covering both policies. As two steps, the first
      # failure skipped the second, so the run that was supposed to prove both
      # assertions bite only ever exercised one of them. Both are evaluated
      # here, both are reported, and the step exits non zero at the end.
      - name: Assert the Microsoft Store certification requirements
        shell: pwsh
        run: |
          $failures = 0

          # SCOPE-AWARE, corrected 2026-08-12. The old version of this block failed 10.1.2.10
          # whenever the shortcut was "ONLY under the installing user's profile", on the theory that
          # a certifier installs elevated and inspects as a different, normal user. That theory is
          # DISPROVEN: The Long View was rejected under 10.3.4 on 2026-08-12 for a PER-MACHINE install
          # (exit 1603 / MSI 1625 "no credential elevation is possible"), and sibling app Reveal the
          # Dream, on the SAME publisher account, proved with the Windows Installer log that the
          # certifier installs UNELEVATED, as the ordinary user. Per-user is therefore the ONLY scope
          # that can install in this channel, and its shortcut correctly lands in that user's own
          # Start Menu. So the assertion is not "All Users" or "per-user", it is: the shortcut is
          # where the DECLARED scope puts it, and the installing user can see it. The declared scope
          # is read from the source, never inferred from a registry hive. See RTD's
          # build-and-verify-windows.yml, which this is ported from.
          $gradle = Get-Content "android/desktop/build.gradle.kts" -Raw
          if ($gradle -notmatch 'perUserInstall\s*=\s*(true|false)') {
            throw "Could not read perUserInstall from android/desktop/build.gradle.kts. This gate must never assume a scope."
          }
          $perUserInstall = $Matches[1] -eq 'true'
          $startMenu = if ($perUserInstall) { "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" }
                       else                 { "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" }
          $scopeName = if ($perUserInstall) { 'per-user' } else { 'per-machine' }
          Write-Host "Declared install scope: $scopeName"
          $found = @()
          if (Test-Path $startMenu) { $found += Get-ChildItem $startMenu -Recurse -Filter '*Long View*.lnk' -ErrorAction SilentlyContinue }
          $found | ForEach-Object { Write-Host "shortcut: $($_.FullName)" }
          if (-not $found) {
            Write-Host "::error::10.1.2.10 FAILED. No Start Menu shortcut under $startMenu, where a $scopeName install must put it, so there is no accessible method of being launched."
            $failures++
          }
          else { Write-Host "10.1.2.10 ok, $scopeName shortcut present" }

          # Either hive. jpackage writes the ARP entry to HKLM even for a per-user install when an
          # ADMINISTRATOR runs the installer, which is exactly what this runner does, so demanding
          # one specific hive would fail a correct build. What 10.2.7 actually asks is that the entry
          # exists somewhere in Add/Remove Programs with a working UninstallString.
          $keys = @(
            'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = $null
          foreach ($k in $keys) {
            $entry = Get-ItemProperty $k -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -like '*Long View*' } | Select-Object -First 1
            if ($entry) { break }
          }
          if (-not $entry) {
            Write-Host "::error::10.2.7 FAILED. No uninstall entry in any hive (HKCU or HKLM), so nothing appears in the Add or Remove Programs list."
            $failures++
          }
          elseif (-not $entry.UninstallString) {
            Write-Host "::error::10.2.7 FAILED. The uninstall entry exists but has no UninstallString, so there is nothing for a user to run."
            $failures++
          }
          else {
            Write-Host "10.2.7 ok, ARP DisplayName:     $($entry.DisplayName)"
            Write-Host "10.2.7 ok, ARP UninstallString: $($entry.UninstallString)"
          }

          # ── ARP Publisher must be the company that SIGNED the installer ──────────────────
          #
          # ADDED 2026-08-11, after certification failed as 10.3.4 "the product failed to install
          # through the Store". It had not. Partner Center's package validation said it "could not
          # identify the app name and the publisher name that your app has added in the add or
          # remove programs", which reads like an install failure and was not one: this very job
          # installed the same commit with /quiet, got exit code 0, and found the shortcut and the
          # ARP entry it asserts above.
          #
          # The cause was the MSI Manufacturer field, which becomes ARP Publisher and which Windows
          # shows beside the Authenticode publisher on the elevation prompt. It said "Augustus
          # Travels LLC", the Apple entity. The certificate says "Little Bird Trading LLC". A
          # package naming a different company than the one that signed it looks, to Windows and to
          # a person reading that prompt, like it is claiming to be from someone it is not.
          #
          # Compared against the signature rather than a hardcoded string, so this keeps being true
          # if the signing identity ever moves. Skipped when the build is unsigned, which is the
          # case in a fork with no Azure access.
          $sig = Get-AuthenticodeSignature "${{ steps.find.outputs.path }}"
          if ($sig.Status -ne "Valid") {
            Write-Host "::warning::Unsigned build, so the ARP publisher cannot be checked against the certificate."
          }
          elseif (-not $entry.Publisher) {
            Write-Host "::error::ARP Publisher is empty. Windows will show no company beside the Authenticode publisher."
            $failures++
          }
          else {
            # The subject is a full distinguished name; the organisation is the part that identifies
            # us, and it changes far less often than the rest of it.
            $org = ($sig.SignerCertificate.Subject -split ',' | Where-Object { $_.Trim().StartsWith('O=') } |
                    Select-Object -First 1) -replace '^\s*O=', ''
            if ($entry.Publisher.Trim() -ne $org.Trim()) {
              Write-Host "::error::ARP Publisher is '$($entry.Publisher)' but the installer is signed by '$org'. Microsoft Store certification rejects this as 10.3.4. Fix `vendor` in android/desktop/build.gradle.kts."
              $failures++
            }
            else { Write-Host "ARP Publisher ok, matches the signing certificate: $($entry.Publisher)" }
          }

          if ($failures -gt 0) { throw "$failures certification requirement(s) failed" }

      - name: Launch the INSTALLED binary
        id: launch
        shell: pwsh
        run: |
          # In BOTH places an install can land: a per-user install puts the app under %LOCALAPPDATA%,
          # a per-machine one under Program Files. Looking in only one made the whole downstream chain
          # depend on a packaging choice it should not care about, and is what broke the per-user build.
          $roots = @("$env:LOCALAPPDATA\The Long View", "$env:ProgramFiles\The Long View", "${env:ProgramFiles(x86)}\The Long View") |
                   Where-Object { $_ -and (Test-Path $_) }
          $exe = $null
          foreach ($r in $roots) {
            $exe = Get-ChildItem $r -Recurse -Filter '*.exe' -EA SilentlyContinue |
                   Where-Object { $_.Name -notlike 'unins*' -and $_.Name -ne 'LongViewHelper.exe' } | Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) { throw "Installed binary not found under %LOCALAPPDATA% or Program Files" }
          Write-Host "launching: $($exe.FullName)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds ${{ inputs.wait_seconds }}
          if ($proc.HasExited) {
            Write-Host "::error::The installed app exited with code $($proc.ExitCode). A jpackage build dies here when the modules() list omits something reached only at runtime, and nothing before this step can tell you."
            exit 1
          }
          Write-Host "still running after ${{ inputs.wait_seconds }}s"
          "pid=$($proc.Id)" >> $env:GITHUB_OUTPUT
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      # The helper as installed: the app runs `register` at start, so by now the protocol, the toast
      # AUMID and (on this Windows 11 class build) the identity package should all be in place.
      # The Widgets Board does not exist on a Server runner, so a placed widget cannot be seen here;
      # what can be proven is registration, the widget declaration Windows recorded, a toast, and a
      # toast button reaching the app.
      - name: "Windows helper: identity package, toast, and a button press"
        shell: pwsh
        run: |
          $exe = Get-Item "${{ steps.launch.outputs.exe }}"
          $helper = Join-Path $exe.DirectoryName "app\resources\LongViewHelper.exe"
          if (-not (Test-Path $helper)) { Write-Host "::error::LongViewHelper.exe is not in the install"; exit 1 }
          $p = Start-Process $helper -ArgumentList register -Wait -PassThru
          Write-Host "register exit: $($p.ExitCode)"
          $log = "$env:APPDATA\TheLongView\helper.log"
          if (Test-Path $log) { Write-Host "--- helper.log ---"; Get-Content $log }
          $pkg = Get-AppxPackage LittleBirdTrading.TheLongView.Identity
          if ($pkg) {
            Write-Host "identity package: $($pkg.PackageFullName) at $($pkg.InstallLocation)"
            $m = Get-AppxPackageManifest $pkg
            $ext = $m.Package.Applications.Application.Extensions.Extension
            Write-Host ("declared: " + (($ext | ForEach-Object { $_.Category }) -join ', '))
            Write-Host ("widgets: " + (($m.Package.Applications.Application.Extensions.Extension.AppExtension.Properties.WidgetProvider.Definitions.Definition | ForEach-Object { $_.Id }) -join ', '))
          } else {
            Write-Host "::warning::the identity package is not registered (see helper.log above); widgets will not appear"
          }
          $scheme = Get-ItemProperty "HKCU:\Software\Classes\thelongview-reminder\shell\open\command" -EA SilentlyContinue
          Write-Host "protocol handler: $($scheme.'(default)')"
          if (-not $scheme) { Write-Host "::error::the toast's button protocol is not registered"; exit 1 }
          $t = Start-Process $helper -ArgumentList @('toast', '"Ready to log today?"', '"A quick note on today keeps your numbers accurate."', 'IN_15_MINUTES="In 15 minutes"', 'IN_1_HOUR="In 1 hour"', 'TOMORROW=Tomorrow') -Wait -PassThru
          Write-Host "toast exit: $($t.ExitCode)"
          if ($t.ExitCode -ne 0) { Write-Host "::error::the toast did not show"; if (Test-Path $log) { Get-Content $log -Tail 20 }; exit 1 }
          Start-Process "thelongview-reminder:snooze/IN_1_HOUR"
          Start-Sleep -Seconds 5
          $req = "$env:APPDATA\TheLongView\requests"
          Write-Host "requests left: $((Get-ChildItem $req -EA SilentlyContinue | ForEach-Object Name) -join ', ')"
          $snooze = "$env:APPDATA\TheLongView\snooze-until"
          if (Test-Path $snooze) { Write-Host "the app picked up the button: snooze-until $(Get-Content $snooze)" }
          else { Write-Host "::error::a toast button press did not reach the app (no snooze-until)"; exit 1 }

      # The build shipped with the stock Java placeholder in its title bar and in Alt+Tab, and
      # the owner has failed store submissions over exactly that before. It was caught by a
      # human looking at a screenshot. It is checked here now.
      - name: Assert the title bar icon is the app's icon, not the toolkit default
        shell: pwsh
        run: ./ci/scripts/verify-window-icon.ps1 -ExePath "${{ steps.launch.outputs.exe }}" -OutDir artifacts

      # ── The part that is not just "it is alive" ───────────────────────────
      # THIS IS NOT THE ACCESSIBILITY CHECK, and for a while it was mistaken for
      # one. UIA finds the top level window and exactly one nameless Pane inside
      # it, which was read as "Compose publishes no semantics and screen readers
      # get nothing". That conclusion does not follow. Compose Desktop does not
      # implement UI Automation on Windows at ALL; it publishes a
      # javax.accessibility tree, which UIA cannot see by design. This step
      # therefore returns the same one-Pane answer whether the app is fully
      # accessible or completely mute, so it can never be evidence either way.
      # The real check is the Java Access Bridge step below. This one is kept
      # for what it can honestly tell us: that a top level window exists, is
      # named, and can be targeted for the synthetic clicking further down.
      - name: Report what UI Automation can see (window discovery, informational)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $cond = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "The Long View")
          $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $cond)
          if (-not $win) {
            Write-Host "::warning::UIA could not find a top level window named 'The Long View'. Listing what it can see:"
            $root.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition) |
              ForEach-Object { Write-Host "  window: '$($_.Current.Name)'  class=$($_.Current.ClassName)" }
            exit 1
          }
          Write-Host "UIA found the window: '$($win.Current.Name)'"
          $all = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
          Write-Host "descendant elements exposed: $($all.Count)"
          $all | Select-Object -First 40 | ForEach-Object {
            Write-Host ("  {0,-22} name='{1}'" -f $_.Current.ControlType.ProgrammaticName, $_.Current.Name)
          }
          if ($all.Count -le 1) {
            Write-Host "UIA sees the window and no inner elements, which is the expected and permanent answer for a Skia-rendered toolkit. It says nothing about accessibility; see the Java Access Bridge step. It does mean clicking has to be synthetic mouse input, which is what verify-ui.ps1 does."
          }

      # ── The accessibility check that can actually fail ────────────────────
      # Reads the app's tree through the Java Access Bridge, which is the same
      # path Narrator, NVDA and JAWS take. Two things have to be true for this
      # to pass and both are easy to lose silently: jdk.accessibility must be in
      # the jpackage modules list, or the bridge class is not in the shipped
      # runtime at all, and Main.kt must set assistive_technologies, or the
      # class is present and never loaded. Neither omission breaks a build, a
      # test, a launch or a screenshot. This step is the only thing that notices.
      - name: Read the accessibility tree through the Java Access Bridge
        shell: pwsh
        run: python ci/scripts/jab-probe.py --min-named ${{ inputs.min_named_elements }}

      # The probe above reads the tree the way a screen reader does. This runs a real one: NVDA,
      # silent synthesizer, IO log, Tab through the first screen, and asserts on what it spoke.
      - name: Run NVDA against the app and check what it says
        shell: pwsh
        run: ./ci/scripts/nvda-speech.ps1 -MustSay "Begin" -OutDir artifacts

      # Runs whether the probe passed or failed, because the three things it prints are the three
      # ways the bridge goes quiet, and none of them is visible from the probe's side. A missing
      # module, a runtime that carries the class but not its native library, and an app that
      # decided at startup not to ask for it all look identical from outside: isJavaWindow false.
      - name: Show what the packaged runtime carries for accessibility
        if: always()
        shell: pwsh
        run: |
          $roots = @("$env:LOCALAPPDATA\The Long View", "$env:ProgramFiles\The Long View") |
                     Where-Object { Test-Path $_ }
          foreach ($r in $roots) {
            $release = Get-ChildItem $r -Recurse -Filter 'release' -EA SilentlyContinue | Select-Object -First 1
            if ($release) {
              $modules = (Get-Content $release.FullName | Where-Object { $_ -like 'MODULES=*' })
              Write-Host "runtime modules: $modules"
              Write-Host "jdk.accessibility present: $($modules -like '*jdk.accessibility*')"
            }
            Write-Host "accessibility libraries in the shipped runtime:"
            Get-ChildItem $r -Recurse -EA SilentlyContinue |
              Where-Object { $_.Name -match 'ccess' } |
              ForEach-Object { Write-Host "  $($_.FullName)" }
          }
          $log = "$env:APPDATA\TheLongView\crash.log"
          if (Test-Path $log) {
            Write-Host "crash.log:"
            Get-Content $log | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "no crash.log, so startup did not record a reason for skipping the bridge"
          }

      # Superseded and NON-BLOCKING. This single synthetic click is flaky on the runner (it does not
      # reliably accept even one click every run), and it false-failed a build whose every screen
      # was proven to render. The two steps below - render each onboarding screen in isolation, then
      # run the whole flow as one autoplay session - cover far more and are the real UI gate now.
      - name: Click the primary button and prove it did something (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: ./ci/scripts/verify-ui.ps1 -OutDir artifacts

      # THE CERTIFICATION GAP. verify-ui.ps1 above clicks ONCE and stops at the first transition.
      # Microsoft failed this app 2026-08-17 under 10.1.2.10 with "does not display any content after
      # the first round of Q&A" - a blank screen once onboarding is finished, a path the single click
      # never reached. This walks every step to the main screen and fails if that screen is blank.
      # Relaunches the app fresh so the walk starts at the welcome screen (onboarding is not persisted
      # until it completes, so a relaunch returns to the beginning).
      - name: Render each onboarding step in isolation and find the blank one
        if: always()
        shell: pwsh
        run: ./ci/scripts/onboarding-steps.ps1 -OutDir artifacts

      - name: Run the whole onboarding as one session and watch for a mid-flow blank
        if: always()
        shell: pwsh
        run: ./ci/scripts/autoplay-capture.ps1 -OutDir artifacts

      # THE DIALOG LAYER ON WINDOWS. Desktop dialogs are their own windows (compose.layers.type=WINDOW,
      # so a screen reader can find them), and Windows renders in software mode. That pairing had never
      # been seen on Windows. The autoplay step above leaves the app on Today, so this presses
      # "Make a plan" through the Access Bridge, the way a screen reader would, and photographs the
      # whole screen. Non-blocking until a run has shown what a good capture looks like.
      - name: Open a dialog through the Access Bridge and photograph it (non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          python ci/scripts/jab-probe.py --press "Make a plan" --no-require-button --print-limit 5
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $g.Dispose()
          $bmp.Save("artifacts/dialog-make-a-plan.png")

      # RETIRED 2026-08-12. This step created a SEPARATE standard user (tlvstduser) and asserted that
      # THAT account could see and open what runneradmin had installed. Its own header stated the
      # model it tested: "install elevated, then come back as an ordinary user and try to use the
      # thing." That model is the disproven one. Two real Microsoft rejections (this app under 10.3.4
      # for a per-machine install, and sibling Reveal the Dream, same publisher, with the Windows
      # Installer log) established that the certifier installs UNELEVATED and inspects AS THE SAME
      # USER who installed. A correct per-user install lands in the installing user's own profile and
      # is therefore invisible to any OTHER account BY DESIGN, so this cross-account probe fails every
      # correct build (it did, here) while passing nothing Microsoft actually checks. It also looked
      # for the shortcut only under %ProgramData% (All Users), the same per-machine assumption.
      #
      # The thing that IS certified, the installing user can find and launch it, is already proven by
      # "Launch the INSTALLED binary" and "Click the primary button", both of which run as the
      # installing user. RTD's proven build-and-verify-windows.yml has no cross-account gate either.
      # scripts/verify-standard-user.ps1 and the deny_users_read break_mode are left in the repo but
      # unused; both existed only to feed this retired check.

      - name: Screenshot the desktop
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bmp.Save("artifacts/installed-app.png")
          Write-Host "screenshot saved, $($b.Width)x$($b.Height)"

      # Uninstalling has to take the widgets' identity package and the toast's protocol handler with
      # it, through the custom action in windows/installer/main.wxs. LAST of the app checks, because
      # it removes the app: an earlier attempt ran before them and pulled the app out from under the
      # icon check.
      - name: "Windows helper: uninstalling unregisters it"
        shell: pwsh
        run: |
          $before = [bool](Get-AppxPackage LittleBirdTrading.TheLongView.Identity)
          Write-Host "identity package before uninstall: $before"
          # Either hive, the same lookup the certification step uses: jpackage writes the entry to
          # HKLM when an administrator runs a per-user install, which is what this runner does.
          $entry = $null
          foreach ($k in @('HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                           'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                           'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
            $entry = Get-ItemProperty $k -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -like '*Long View*' } | Select-Object -First 1
            if ($entry) { break }
          }
          if (-not $entry) { Write-Host "::error::no uninstall entry to run"; exit 1 }
          Stop-Process -Id ${{ steps.launch.outputs.pid }} -Force -EA SilentlyContinue
          Start-Sleep -Seconds 3
          Write-Host "uninstalling with: $($entry.UninstallString)"
          if ($entry.UninstallString -match '\{[0-9A-Fa-f-]{36}\}') {
            # VERBOSE, and the custom action's lines printed below. Return="ignore" means the
            # uninstall says nothing when our action fails or is skipped, and two runs were spent
            # guessing at that silence.
            $msilog = "$env:RUNNER_TEMP\uninstall.log"
            Start-Process msiexec.exe -ArgumentList "/x", $Matches[0], "/quiet", "/norestart", "/l*v", "`"$msilog`"" -Wait
            if (Test-Path $msilog) {
              Write-Host "--- msi custom action ---"
              Select-String -Path $msilog -Pattern 'TlvUnregister|LongViewHelper|Action start 1?[0-9:]*: InstallValidate|REMOVE =|RESTART MANAGER|RmShutdown|RmRestart|Restarting' |
                ForEach-Object { Write-Host $_.Line }
            }
          } else {
            $exe, $rest = $entry.UninstallString -split ' ', 2
            Start-Process ($exe.Trim('"')) -ArgumentList "/quiet" -Wait
          }
          Start-Sleep -Seconds 5
          $after = [bool](Get-AppxPackage LittleBirdTrading.TheLongView.Identity)
          $scheme = [bool](Get-Item "HKCU:\Software\Classes\thelongview-reminder" -EA SilentlyContinue)
          $stillUp = @(Get-Process "The Long View" -EA SilentlyContinue)
          Write-Host "after uninstall: identity package $after, protocol handler $scheme, app processes $($stillUp.Count)"
          # WHERE it actually lives. HKCU:\Software\Classes is a MERGED view of the user's own
          # classes and HKLM's, so a key the helper really did delete from the user's hive can
          # still read as present here. These three lines say which it is.
          foreach ($k in @("Registry::HKEY_CURRENT_USER\Software\Classes\thelongview-reminder",
                           "HKLM:\Software\Classes\thelongview-reminder",
                           "HKCR:\thelongview-reminder")) {
            $found = Get-Item $k -EA SilentlyContinue
            Write-Host ("  {0}: {1}" -f $k, [bool]$found)
            if ($found) {
              $cmd = Get-ItemProperty "$k\shell\open\command" -EA SilentlyContinue
              Write-Host ("    command: {0}" -f $cmd.'(default)')
            }
          }
          # The helper writes why it gave up here and nowhere else, and the first failure of this
          # check cost a whole run to work out for want of these four lines.
          # Both copies: the uninstaller's custom action runs as SYSTEM, whose %APPDATA% is not
          # this one, so the helper also writes to ProgramData.
          foreach ($log in @("$env:APPDATA\TheLongView\helper.log", "$env:ProgramData\TheLongView\helper.log")) {
            if (Test-Path $log) { Write-Host "--- $log ---"; Get-Content $log }
          }
          if ($before -and $after) { Write-Host "::error::uninstalling left the widgets' identity package registered"; exit 1 }
          if ($scheme) { Write-Host "::error::uninstalling left the toast's protocol handler registered"; exit 1 }
          Write-Host "uninstall left nothing behind"

      - name: Collect Windows Application event log
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-EventLog -LogName Application -Newest 40 -EA SilentlyContinue |
            Select-Object TimeGenerated,EntryType,Source,Message |
            Format-List | Out-File artifacts/application-log.txt

      # ── Publish, and only if everything above passed ──────────────────────
      # Deliberately last, and gated on success(). A URL handed over is a URL that will be
      # pasted into Partner Center, so nothing that failed a check gets one. Skipped entirely
      # for break_mode runs, whose whole purpose is to produce a broken installer.
      - name: Publish the signed installer to a permanent URL
        if: ${{ success() && inputs.break_mode == 'none' && inputs.publish }}
        id: publish
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Not secrets: the account id and bucket name are in every published URL anyway.
          R2_ACCOUNT_ID: a20a6afef6c2b00fa8406e8755103537
          R2_BUCKET: thelongview-downloads
        run: |
          $src = "${{ steps.find.outputs.path }}"
          $version = [regex]::Match((Split-Path $src -Leaf), '(\d+\.\d+\.\d+)').Groups[1].Value
          $sha = "${{ steps.src.outputs.sha }}"

          # Keyed by commit sha, not version number. A version number gets reused during
          # development and the URL must be immutable: Partner Center caches what it fetched,
          # so the same URL quietly meaning something different later is the failure mode.
          # r2-put refuses to overwrite, so publishing the same sha twice FAILS rather than
          # silently replacing a package already submitted.
          $pathname = "windows/$sha/TheLongView-Setup-$version.exe"
          $clean = "$env:RUNNER_TEMP\TheLongView-Setup-$version.exe"
          Copy-Item $src $clean   # the built name contains spaces; the URL should not

          # Cloudflare R2 over the S3 API, replacing Vercel Blob: R2 charges nothing for egress,
          # and serving an installer is almost all egress. The AWS SDK, not a CLI, so no
          # human-shaped credential is needed. See ci/scripts/r2-put.mjs.
          npm install --no-save --silent "@aws-sdk/client-s3@3"
          node ci/scripts/r2-put.mjs $clean $pathname
          if ($LASTEXITCODE -ne 0) { throw "R2 upload failed (exit $LASTEXITCODE)" }

          # Deterministic: the bucket's custom domain plus the key. Nothing to parse back out of
          # the upload, and the "Prove the URL is direct" step below fetches it to confirm.
          $url = "https://dl.thelongviewapp.com/$pathname"
          Write-Host "url=$url"
          "url=$url" >> $env:GITHUB_OUTPUT
          $url | Out-File artifacts/package-url.txt

      # A URL is only handed over once it has actually been fetched. Partner Center rejects a
      # redirecting link, which is exactly why GitHub release links cannot be used, and a URL
      # that serves different bytes than were verified above would make this whole run
      # meaningless.
      - name: Prove the URL is direct and serves the bytes that were verified
        if: ${{ success() && inputs.break_mode == 'none' && inputs.publish }}
        shell: pwsh
        run: |
          $url = "${{ steps.publish.outputs.url }}"
          $head = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 0 -SkipHttpErrorCheck
          Write-Host "HTTP $($head.StatusCode) $($head.StatusDescription)"
          if ($head.StatusCode -ge 300 -and $head.StatusCode -lt 400) {
            Write-Host "::error::The URL redirects (HTTP $($head.StatusCode) to $($head.Headers.Location)). Partner Center rejects redirecting package URLs."
            exit 1
          }
          if ($head.StatusCode -ne 200) { throw "URL returned HTTP $($head.StatusCode)" }

          $dl = "$env:RUNNER_TEMP\roundtrip.exe"
          Invoke-WebRequest -Uri $url -OutFile $dl
          $a = (Get-FileHash "${{ steps.find.outputs.path }}" -Algorithm SHA256).Hash
          $b = (Get-FileHash $dl -Algorithm SHA256).Hash
          Write-Host "built    SHA256: $a"
          Write-Host "served   SHA256: $b"
          if ($a -ne $b) { Write-Host "::error::The bytes at the URL are not the bytes that were built and verified."; exit 1 }

          # The signature must survive the round trip too, since that is what a user downloads.
          $sig = Get-AuthenticodeSignature $dl
          Write-Host "downloaded file signature: $($sig.Status), signer $($sig.SignerCertificate.Subject)"
          if ("${{ env.AZURE_CLIENT_ID }}" -ne "" -and $sig.Status -ne "Valid") {
            Write-Host "::error::The downloaded installer is not validly signed."
            exit 1
          }
          "`n$a  SHA256 of the published installer" | Out-File artifacts/package-url.txt -Append

      - name: Say where the package is
        if: ${{ success() && inputs.break_mode == 'none' && inputs.publish }}
        shell: pwsh
        run: |
          "## Windows package" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Paste this into Partner Center:" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "``${{ steps.publish.outputs.url }}``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-verification
          path: artifacts/
